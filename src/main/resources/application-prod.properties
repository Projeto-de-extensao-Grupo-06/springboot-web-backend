app.env=prod

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql-db}:3306/solarway?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:solarway}
spring.datasource.password=${MYSQL_PASSWORD:06241234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicitly setting the dialect prevents startup failure if the DB is momentarily unreachable
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Connection pool settings for better resilience
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=0

logging.level.org.hibernate.tool.schema=DEBUG
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.data.redis.host=${REDIS_HOST:redis-multidb}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASSWORD:0624}

jwt.validity=21600000
jwt.secret=${JWT_SECRET:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL:dummy@email.com}
spring.mail.password=${EMAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.storage.s3.bucket=${BUCKET_NAME:dummy-bucket}

aws.region=us-east-1

aws.accessKeyId=${AWS_ACCESS_KEY_ID:dummy}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:dummy}
aws.sessionToken=${AWS_SESSION_TOKEN:dummy}

spring.cache.type=redis
solarize.security.bot-secret=${BOT_SECRET:solarize_whatsapp_bot_super_secret}